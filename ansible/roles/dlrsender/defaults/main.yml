---
dlrsender_deploy_mode: standalone   # standalone | shared_compose

# --- existing single-instance vars ---
dlrsender_container_name: dlrsender
dlrsender_image: ""
dlrsender_container_port: 15000
dlrsender_host_port: 15000
dlrsender_network: dlrsender-net
dlrsender_kafka_brokers: ""
dlrsender_restart_policy: always

# --- Docker/Nexus registry ---
# Used by the DLR Sender application from inside the container.
# Nexus is connected to the dlrsender-net Docker network.
dlrsender_registry_ip: "nexus"
dlrsender_registry_port: "8082"

# --- multi-instance support ---
# If dlrsender_instances is not defined in inventory/group_vars,
# one instance is automatically created from the variables above.
dlrsender_instances: >-
  {{
    [{
      'name': dlrsender_container_name,
      'container_name': dlrsender_container_name,
      'host_port': dlrsender_host_port,
      'container_port': dlrsender_container_port,
      'kafka_brokers': dlrsender_kafka_brokers
    }]
  }}

# --- shared_compose mode ---
dlrsender_compose_file: ""          # e.g. /opt/platform/docker-compose.yml
dlrsender_compose_service: dlrsender

# --- registry authentication ---
# Used by Ansible for Docker registry login and image pull.
dlrsender_registry: ""
dlrsender_registry_user: ""
dlrsender_registry_pass: ""

# --- health check + rollback ---
rollback_enabled: true
health_check_retries: 10
health_check_delay: 5
dlrsender_state_dir: /opt/dlrsender/state
