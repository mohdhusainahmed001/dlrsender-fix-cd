---
- name: Check DLR Sender HTTP metrics endpoint
  ansible.builtin.uri:
    url: "http://{{ item.container_name }}:{{ item.container_port | default(dlrsender_container_port) }}/metrics"
    method: GET
    status_code: 200
    return_content: false
  register: dlrsender_http_health
  retries: "{{ health_check_retries }}"
  delay: "{{ health_check_delay }}"
  until: dlrsender_http_health.status == 200
  loop: "{{ dlrsender_instances }}"
  loop_control:
    label: "{{ item.name }}"
  when: dlrsender_deploy_mode == 'standalone'
- name: Verify each standalone container is actually running
  community.docker.docker_container_info:
    name: "{{ item.container_name }}"
  register: dlrsender_health_standalone
  failed_when: >-
    not (dlrsender_health_standalone.exists | default(false))
    or dlrsender_health_standalone.container.State.Status != 'running'
  loop: "{{ dlrsender_instances }}"
  loop_control:
    label: "{{ item.name }}"
  when: dlrsender_deploy_mode == 'standalone'
- name: Verify shared-compose DLR Sender service is running
  community.docker.docker_container_info:
    name: "{{ dlrsender_compose_service }}"
  register: dlrsender_health_compose
  failed_when: >-
    not (dlrsender_health_compose.exists | default(false))
    or dlrsender_health_compose.container.State.Status != 'running'
  when: dlrsender_deploy_mode == 'shared_compose'
- name: All instances healthy
  ansible.builtin.debug:
    msg: "SUCCESS: {{ item.name }} healthy at http://{{ item.container_name }}:{{ item.container_port | default(dlrsender_container_port) }}/metrics"
  loop: "{{ dlrsender_instances }}"
  loop_control:
    label: "{{ item.name }}"
  when: dlrsender_deploy_mode == 'standalone'
