---
# NOTE: this checks that the container is running AND accepting TCP
# connections on its published port. Swap in a real HTTP check (e.g. a
# /health or /metrics endpoint) here once one is confirmed for dlrsender -
# this is a safe baseline in the meantime, not a guess dressed up as fact.

- name: Wait for each instance to accept connections on its published port
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ item.host_port }}"
    state: started
    delay: "{{ health_check_delay }}"
    timeout: "{{ health_check_retries * health_check_delay }}"
  loop: "{{ dlrsender_instances }}"
  loop_control:
    label: "{{ item.name }}"
  when: dlrsender_deploy_mode == 'standalone'

- name: Verify each standalone container is actually in a running state
  community.docker.docker_container_info:
    name: "{{ item.container_name }}"
  register: dlrsender_health_standalone
  failed_when: >-
    not (dlrsender_health_standalone.exists | default(false))
    or dlrsender_health_standalone.container.State.Status != 'running'
  loop: "{{ dlrsender_instances }}"
  loop_control:
    label: "{{ item.name }}"
  when: dlrsender_deploy_mode == 'standalone'

- name: Verify the shared-compose dlrsender service is running (production)
  community.docker.docker_container_info:
    name: "{{ dlrsender_compose_service }}"
  register: dlrsender_health_compose
  failed_when: >-
    not (dlrsender_health_compose.exists | default(false))
    or dlrsender_health_compose.container.State.Status != 'running'
  when: dlrsender_deploy_mode == 'shared_compose'

- name: All instances healthy
  ansible.builtin.debug:
    msg: "{{ item.name }} healthy on port {{ item.host_port }}"
  loop: "{{ dlrsender_instances }}"
  loop_control:
    label: "{{ item.name }}"
  when: dlrsender_deploy_mode == 'standalone'
