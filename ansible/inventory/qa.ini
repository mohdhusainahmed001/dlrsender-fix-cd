[qa]
localhost ansible_connection=local

[qa:vars]
dlrsender_deploy_mode=standalone
dlrsender_network=dlrsender-net
dlrsender_kafka_brokers=10.20.3.101:9092,10.20.3.102:9092

# TWO instances on the same host - purely a config change, no role/task edits needed.
# (Ansible ini format can't hold a nested list cleanly, so this is set via a
# group_vars YAML file instead - see inventory/group_vars/qa.yml)
