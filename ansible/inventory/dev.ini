[dev]
localhost ansible_connection=local

[dev:vars]
dlrsender_deploy_mode=standalone
dlrsender_container_name=dlrsender
dlrsender_host_port=15000
dlrsender_container_port=15000
dlrsender_network=dlrsender-net
dlrsender_kafka_brokers=10.20.3.101:9092,10.20.3.102:9092
# dlrsender_image is passed in from Jenkins via --extra-vars (built from
# the same registry/repoPath scheme your CI pipeline already uses)
